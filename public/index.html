<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheris AI - CogniPulse AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        accent: '#6366f1'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-100 font-sans antialiased h-screen flex flex-col justify-between overflow-hidden">

    <!-- Header -->
    <header class="bg-cardBg border-b border-gray-800 p-4 flex items-center justify-between shadow-md z-10">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-lg shadow-lg">
                A
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight tracking-wide">Aetheris AI</h1>
                <p class="text-xs text-indigo-400 font-medium">Powered by CogniPulse AI</p>
            </div>
        </div>
        <div class="text-xs bg-gray-800 text-gray-300 px-3 py-1.5 rounded-full border border-gray-700 shadow-inner">
            Guest Mode (Connected)
        </div>
    </header>

    <!-- Chat Area -->
    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 max-w-4xl w-full mx-auto">
        <!-- Welcome Message -->
        <div class="flex items-start space-x-4">
            <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-sm font-bold shrink-0 shadow">
                AI
            </div>
            <div class="bg-cardBg border border-gray-800 text-gray-100 p-4 rounded-2xl max-w-xl shadow-md text-sm leading-relaxed whitespace-pre-wrap">
Hello! I am **Aetheris AI**, engineered by **CogniPulse AI** (Founded by Ahmed). How can I assist you today across coding, cybersecurity, business strategy, or creative arts?
            </div>
        </div>
    </main>

    <!-- Input Footer -->
    <footer class="bg-cardBg border-t border-gray-800 p-4 shadow-lg">
        <form id="chatForm" class="max-w-4xl mx-auto flex items-center space-x-3">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Message Aetheris AI..." 
                autocomplete="off"
                class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 shadow-inner"
            >
            <button 
                type="submit" 
                id="sendBtn"
                class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-6 py-3 rounded-xl transition duration-200 shadow-md flex items-center justify-center text-sm"
            >
                Send
            </button>
        </form>
    </footer>

    <!-- Script to handle chat logic -->
    <script>
        const chatContainer = document.getElementById('chatContainer');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');

        let messageHistory = [];

        chatForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            // Add user message to UI
            appendMessage(text, 'user');
            messageHistory.push({ role: 'user', content: text });
            userInput.value = '';
            userInput.disabled = true;

            const loadingId = appendMessage('Thinking...', 'ai', true);

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: messageHistory })
                });

                const data = await response.json();
                
                // Remove loading bubble
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();

                if (response.ok && data.reply) {
                    appendMessage(data.reply, 'ai');
                    messageHistory.push({ role: 'model', content: data.reply });
                } else {
                    appendMessage('Error: ' + (data.error || 'Server error'), 'ai');
                }
            } catch (err) {
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();
                appendMessage('Network connection failed.', 'ai');
            } finally {
                userInput.disabled = false;
                userInput.focus();
            }
        });

        function appendMessage(text, sender) {
            const id = 'msg-' + Date.now();
            const isUser = sender === 'user';
            
            const html = `
                <div id="${id}" class="flex items-start space-x-4 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}">
                    <div class="w-8 h-8 rounded-full ${isUser ? 'bg-purple-600' : 'bg-indigo-600'} flex items-center justify-center text-sm font-bold shrink-0 shadow">
                        ${isUser ? 'U' : 'AI'}
                    </div>
                    <div class="${isUser ? 'bg-indigo-600 text-white' : 'bg-cardBg border border-gray-800 text-gray-100'} p-4 rounded-2xl max-w-xl shadow-md text-sm leading-relaxed whitespace-pre-wrap">
                        ${text}
                    </div>
                </div>
            `;
            chatContainer.insertAdjacentHTML('beforeend', html);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
